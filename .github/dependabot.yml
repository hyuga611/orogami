version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 は tsup 8.5.1 同梱の rollup-plugin-dts が未対応で、
      # 型定義(dist/*.d.ts)の生成が useCaseSensitiveFileNames で落ちる。
      # JS のビルド自体は成功してしまうので気づきにくい。
      # tsup 側が対応したらこの ignore を外す。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # budoux は devDependency で、ビルド時に dist へバンドルしている。
      # そのため budoux が引き連れてくる google-artifactregistry-auth 以下
      # （uuid / gaxios / node-fetch など）は、公開する tarball には一切入らない。
      # ここに出る脆弱性警告は利用者に届かないので、直接は上げられない
      # 推移的依存として無視する。budoux 自体の更新は対象のまま。
      # budoux の minor 以上はモデルが変わりうる。0.9.0 では実際に分割位置が
      # 変わり（"いい/天気ですね" → "いい天気ですね"）、バンドルしている以上
      # それはそのまま利用者の折り返し位置の変更になる。devDependency の
      # 更新に見えて挙動変更なので、人が判断してから上げる。patch は許可。
      - dependency-name: "budoux"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

      - dependency-name: "google-artifactregistry-auth"
      - dependency-name: "google-auth-library"
      - dependency-name: "gaxios"
      - dependency-name: "uuid"
