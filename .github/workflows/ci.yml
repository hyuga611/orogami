name: ci
on: [push, pull_request]

jobs:
  build:
    # npm ci (not install) is deliberate — it fails on a lockfile a bot broke.
    # npm test runs pretest -> build, so the suite always runs against fresh dist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
