name: ci
on: [push, pull_request]

jobs:
  build:
    # npm ci (not install) is deliberate — it fails on a lockfile a bot broke.
    # npm test runs pretest -> build, so the suite always runs against fresh dist.
    #
    # The matrix is not decoration. This package declares engines >=18 and, until
    # budoux 0.8.4, that promise was false: budoux 0.7.0 shipped an ESM file that
    # its own package.json declared as CommonJS, so importing it only worked on the
    # Node versions that detect module syntax by default (>=20.19, >=22.7). A single
    # Node 20 job was green throughout, because 20.x happened to be on the working
    # side of that line. Note the failure was NOT monotonic — 20.19 worked while
    # 22.6 did not — so testing only the declared floor would not have caught it.
    # Every supported major runs, and the floor runs first.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['18.x', '20.x', '22.x', '24.x']
        include:
          # The suite is written on Windows; CI never proved it there until now.
          - os: windows-latest
            node: '22.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      # Build before typecheck, not after. `examples/satori-breaks.ts` imports
      # `../dist/index.js` on purpose — it is the recipe a reader copies, so it
      # has to go through the published entry point rather than through `src/`.
      # On a clean checkout that module does not exist yet, so `tsc --noEmit`
      # reported four errors that said nothing about the code:
      #
      #   examples/satori-breaks.ts(20,31): TS2307: Cannot find module '../dist/index.js'
      #   examples/satori-breaks.ts(64,26): TS7006: Parameter 'p' implicitly has an 'any' type
      #
      # The TS7006 pair was downstream of the TS2307 pair: with the module
      # unresolved, the callback parameter had no type to infer from.
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  lint:
    # Correctness rules only, no formatter. biome.jsonc records which rules are off
    # and why: each one is a preference this codebase already applies consistently,
    # so enforcing a different one would be churn rather than improvement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
